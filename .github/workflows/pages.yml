name: Publish Diane Andrew website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: diane-andrew-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate search-indexable website
        env:
          DRAFT: 'false'
          SITE_URL: 'https://nickygrant.github.io/diane-andrew'
          CONTACT_EMAIL: 'Dianelumley9@gmail.com'
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: npm run build
      - name: Verify generated site
        env:
          CONTACT_EMAIL: 'Dianelumley9@gmail.com'
        run: |
          npm run check
          node scripts/check-consent.mjs
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-search-engines:
    needs: deploy
    if: vars.INDEXNOW_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Notify IndexNow of the published pages
        env:
          SITE_URL: 'https://nickygrant.github.io/diane-andrew'
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs
