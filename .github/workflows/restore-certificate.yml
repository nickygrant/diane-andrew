name: Restore certificate asset
on:
  push:
    paths:
      - '.github/workflows/restore-certificate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore photograph using original file checksum
        run: node scripts/repair-certificate.mjs
      - name: Publish corrected certificate image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/certificates-sheet.webp
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete original certificate photo contact sheet"
            git push
          fi
